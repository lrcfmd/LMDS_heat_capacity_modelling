[project]
name = "heat-capacity"
version = "1.0.0"
description = "Heat-capacity modelling (Debye/Einstein/linear component fitting) for the LMDS platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.26.0",
    "boto3>=1.34.0",
    "structlog>=25.5.0",
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.11",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
]

[project.scripts]
model-run = "cmds.run:run_cli"
model-types = "cmds.model_types:main"
validate-model = "cmds.validate_model:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cmds", "src/infrastructure", "src/model"]

[tool.uv]
package = true
